[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "varejo360_market_mix_modeling"
version = "0.0.1"
description = "Marketing Mix Modeling for the varejo360 enterprise (fake business)"
authors = [
  { name = "Vinicius T. Miura" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["varejo360_market_mix_modeling"]
force_sort_within_sections = true


